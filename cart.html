```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart | DNHS MealHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #123d2b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    main {
      width: min(900px, 92%);
      margin: 30px auto;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 3px 12px #00000010;
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .food-emoji {
      font-size: 36px;
    }

    .details {
      flex: 1;
    }

    .details h3 {
      margin: 0 0 7px;
    }

    .quantity {
      width: 70px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    button, .link-button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .primary {
      background: #176b43;
      color: white;
    }

    .remove {
      background: #ffe8e8;
      color: #a32020;
    }

    .secondary {
      background: #e8eee9;
      color: #123d2b;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #message {
      margin: 15px 0;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
    }

    @media (max-width: 520px) {
      .cart-item {
        flex-wrap: wrap;
      }

      .details {
        min-width: 150px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🛒 DNHS MealHub</h1>
    <p>Your food, your order</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="order.html">Track Order</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2>My Cart</h2>
      <p>Review your items before placing your order.</p>
      <div id="cartItems">Loading cart...</div>
      <div id="summary" hidden>
        <div class="total-row">
          <span>Total</span>
          <span>₱<span id="total">0.00</span></span>
        </div>
        <div class="actions">
          <button class="primary" id="checkoutButton" onclick="checkout()">
            Place Order
          </button>
          <a class="link-button secondary" href="menu.html">Add More Food</a>
        </div>
      </div>
      <p id="message" role="status"></p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    const cartItemsElement = document.getElementById("cartItems");
    const summaryElement = document.getElementById("summary");
    const totalElement = document.getElementById("total");
    const messageElement = document.getElementById("message");
    const checkoutButton = document.getElementById("checkoutButton");

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        return Array.isArray(cart) ? cart : [];
      } catch {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function showMessage(message, isError = false) {
      messageElement.textContent = message;
      messageElement.style.color = isError ? "#b42318" : "#176b43";
    }

    function renderCart() {
      const cart = getCart();
      cartItemsElement.replaceChildren();

      if (cart.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";

        const heading = document.createElement("h3");
        heading.textContent = "Your cart is empty.";

        const link = document.createElement("a");
        link.href = "menu.html";
        link.className = "link-button primary";
        link.textContent = "Browse Menu";

        empty.append(heading, link);
        cartItemsElement.appendChild(empty);
        summaryElement.hidden = true;
        return;
      }

      summaryElement.hidden = false;
      let total = 0;

      cart.forEach((item, index) => {
        const quantity = Math.max(1, Math.floor(Number(item.quantity) || 1));
        const price = Number(item.price) || 0;
        total += price * quantity;

        const row = document.createElement("div");
        row.className = "cart-item";

        const emoji = document.createElement("div");
        emoji.className = "food-emoji";
        emoji.textContent = item.emoji || "🍽️";

        const details = document.createElement("div");
        details.className = "details";

        const name = document.createElement("h3");
        name.textContent = item.name || "Food item";

        const priceText = document.createElement("p");
        priceText.textContent = "₱" + money(price) + " each";

        details.append(name, priceText);

        const quantityInput = document.createElement("input");
        quantityInput.className = "quantity";
        quantityInput.type = "number";
        quantityInput.min = "1";
        quantityInput.max = "50";
        quantityInput.value = String(quantity);
        quantityInput.setAttribute("aria-label", "Quantity for " + (item.name || "food item"));

        quantityInput.addEventListener("change", () => {
          const updatedCart = getCart();
          const newQuantity = Math.floor(Number(quantityInput.value));

          if (!Number.isFinite(newQuantity) || newQuantity < 1 || newQuantity > 50) {
            showMessage("Quantity must be between 1 and 50.", true);
            renderCart();
            return;
          }

          updatedCart[index].quantity = newQuantity;
          saveCart(updatedCart);
          showMessage("");
          renderCart();
        });

        const removeButton = document.createElement("button");
        removeButton.className = "remove";
        removeButton.textContent = "Remove";

        removeButton.addEventListener("click", () => {
          const updatedCart = getCart();
          updatedCart.splice(index, 1);
          saveCart(updatedCart);
          showMessage("Item removed.");
          renderCart();
        });

        const subtotal = document.createElement("strong");
        subtotal.textContent = "₱" + money(price * quantity);

        row.append(emoji, details, quantityInput, subtotal, removeButton);
        cartItemsElement.appendChild(row);
      });

      totalElement.textContent = money(total);
    }

    async function checkout() {
      const cart = getCart();

      if (cart.length === 0) {
        showMessage("Your cart is empty.", true);
        return;
      }

      checkoutButton.disabled = true;
      checkoutButton.textContent = "Placing Order...";
      showMessage("Submitting your order...");

      try {
        const orderId = await createOrder(cart);
        window.location.href = "order.html?id=" + encodeURIComponent(orderId);
      } catch (error) {
        console.error(error);
        showMessage(
          error.message || "Could not place your order. Please try again.",
          true
        );
        checkoutButton.disabled = false;
        checkoutButton.textContent = "Place Order";
      }
    }

    renderCart();
  </script>
</body>
</html>
