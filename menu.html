<!DOCTYPE html>
<html lang="en">


<head>


   <meta charset="UTF-8">


   <meta
       name="viewport"
       content="width=device-width, initial-scale=1.0"
   >


   <title>Menu - DNHS MealHub</title>


   <link
       rel="stylesheet"
       href="style.css"
   >


</head>


<body>


<header>


   <nav class="navbar">


       <a
           href="index.html"
           class="logo"
       >


           <img
               src="logo.png"
               alt="DNHS MealHub Logo"
           >


       </a>


       <div class="nav-links">


           <a href="index.html">
               Home
           </a>


           <a href="menu.html">
               Menu
           </a>


           <a
               href="cart.html"
               class="nav-cart"
           >
               🛒 Cart
           </a>


           <a href="staff.html">
               👤 Staff
           </a>


       </div>


   </nav>


</header>




<main class="container">


   <div class="page-title">


       <h2>
           🍴 Today's Menu
       </h2>


       <p>
           Choose what you want from the DNHS canteen.
       </p>


   </div>




   <div class="menu-toolbar">


       <input
           id="search"
           class="search-box"
           type="text"
           placeholder="🔎 Search food..."
           oninput="displayFoods()"
       >


       <div class="category-row">


           <button
               class="category-btn active"
               onclick="setCategory('All',this)"
           >
               All
           </button>


           <button
               class="category-btn"
               onclick="setCategory('Meals',this)"
           >
               🍱 Meals
           </button>


           <button
               class="category-btn"
               onclick="setCategory('Snacks',this)"
           >
               🍟 Snacks
           </button>


           <button
               class="category-btn"
               onclick="setCategory('Drinks',this)"
           >
               🥤 Drinks
           </button>


       </div>


   </div>




   <div
       id="foodGrid"
       class="food-grid"
   ></div>


</main>




<footer>


   <div class="footer-title">
       🍱 DNHS MealHub
   </div>


   Dayap National High School


</footer>




<script>


const foods = [];




function getCustomFoods() {
   return JSON.parse(localStorage.getItem("customFoods")) || [];
}


function getAllFoods() {
   return foods.concat(getCustomFoods());
}




let selectedCategory = "All";




function getStock() {


   return JSON.parse(
       localStorage.getItem("foodStock")
   ) || {};


}




function setCategory(category, button) {


   selectedCategory = category;


   document
       .querySelectorAll(".category-btn")
       .forEach(btn =>
           btn.classList.remove("active")
       );


   button.classList.add("active");


   displayFoods();


}




function displayFoods() {


   const grid =
       document.getElementById("foodGrid");


   const search =
       document
           .getElementById("search")
           .value
           .toLowerCase();


   const stock = getStock();




   const filtered = getAllFoods().filter(food => {


       const matchesSearch =
           food.name
               .toLowerCase()
               .includes(search);


       const matchesCategory =
           selectedCategory === "All" ||
           food.category === selectedCategory;


       return matchesSearch &&
           matchesCategory;


   });




   if (filtered.length === 0) {


       grid.innerHTML = `


           <div class="card">


               <h2>
                   No food found 😢
               </h2>


               <p>
                   Try another search.
               </p>


           </div>


       `;


       return;


   }




   grid.innerHTML =
       filtered.map(food => {


           const available =
               stock[food.id] !== false;




           return `


               <div class="food-card">


                   <div class="food-visual">
                   <span class="food-tag">${food.category}</span>
                   ${
                   food.image
                   ? `<img src="${food.image}" alt="${food.name}" class="food-image">`
                   : food.emoji
                   }
                   </div>




                   <div class="food-info">


                       <h3>
                           ${food.name}
                       </h3>


                       <p class="food-description">
                           ${food.description}
                       </p>




                       <span class="status ${
                           available
                               ? "available"
                               : "sold-out"
                       }">


                           ${
                               available
                                   ? "Available"
                                   : "Sold Out"
                           }


                       </span>




                       <div class="food-bottom">


                           <span class="price">
                               ₱${food.price}
                           </span>




                           <button
                               class="add-btn"
                               ${
                                   available
                                       ? ""
                                       : "disabled"
                               }
                               onclick="addToCart(${food.id})"
                           >


                               ${
                                   available
                                       ? "Add +"
                                       : "Sold Out"
                               }


                           </button>


                       </div>


                   </div>


               </div>


           `;


       }).join("");


}




function addToCart(id) {


   let cart =
       JSON.parse(
           localStorage.getItem("cart")
       ) || [];




   const food =
       getAllFoods().find(
           item => item.id === id
       );




   const existing =
       cart.find(
           item => item.id === id
       );




   if (existing) {


       existing.quantity++;


   } else {


       cart.push({


           id: food.id,
           name: food.name,
           price: food.price,
           emoji: food.emoji,
           quantity: 1


       });


   }




   localStorage.setItem(
       "cart",
       JSON.stringify(cart)
   );




   alert(
       food.name +
       " added to cart! 🛒"
   );


}




displayFoods();


</script>


</body>
</html>
